project:
  type: website
  output-dir: _site

website:
  title: "ULMS RDP Setup"
  description: "Connect to the ULMS Windows server from Linux, macOS or Windows with one command."
  site-url: "https://shunyakmr.github.io/ULMS-rdp/"
  repo-url: "https://github.com/shunyakmr/ULMS-rdp"
  repo-actions: [edit, issue]
  navbar:
    background: primary
    right:
      - icon: github
        href: https://github.com/shunyakmr/ULMS-rdp
        aria-label: GitHub
  page-footer:
    center: "Community guide — not an official ULMS/University IT document."

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    code-block-bg: true
    code-block-border-left: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true

execute:
  enabled: false
