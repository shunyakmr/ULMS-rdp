project:
  type: website
  output-dir: _site

website:
  title: "ULMS RDP Setup"
  description: "Connect from Ubuntu (or WSL2) to the ULMS Windows server over RDP."
  site-url: "https://shunyakmr.github.io/ULMS-rdp/"
  repo-url: "https://github.com/shunyakmr/ULMS-rdp"
  repo-actions: [edit, issue]
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - href: index.qmd
        text: Overview
      - href: setup.qmd
        text: Core Setup
      - href: hacks.qmd
        text: Tips & Hacks
      - href: troubleshooting.qmd
        text: Troubleshooting
    right:
      - icon: github
        href: https://github.com/shunyakmr/ULMS-rdp
        aria-label: GitHub
  sidebar:
    style: docked
    contents:
      - index.qmd
      - setup.qmd
      - hacks.qmd
      - troubleshooting.qmd
  page-footer:
    center: "Community guide — not an official ULMS/University IT document."

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    code-block-bg: true
    code-block-border-left: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true

execute:
  enabled: false
